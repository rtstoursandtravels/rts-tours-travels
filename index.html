<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#092d68">
<title>RTS Tours & Travels</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a href="#" class="wordmark" data-page="home"><b>RTS</b><small>TOURS &amp; TRAVELS</small></a>
  <a class="wa-top" href="https://wa.me/919326685517" target="_blank" rel="noopener">WhatsApp</a>
</header>
<main>
  <section class="page active" id="home">
    <div class="stage" data-ratio="1.0">
      <img src="home.png" alt="RTS Tours & Travels – Our Travel Services">
      <button class="hotspot" style="left:4%;top:24%;width:31%;height:29%" data-page="purpose" aria-label="Return Cancellation Ticket"></button>
      <button class="hotspot" style="left:37%;top:24%;width:30%;height:29%" data-page="hotel" aria-label="Hotel Booking"></button>
    </div>
  </section>

  <section class="page" id="purpose">
    <div class="stage" data-ratio="0.9140625">
      <img src="purpose.png" alt="Dummy Ticket / Return Cancellation Ticket – Purpose">
      <button class="hotspot" style="left:3%;top:45%;width:47%;height:27%" data-page="travel" aria-label="Travel purpose"></button>
      <button class="hotspot" style="left:51%;top:45%;width:46%;height:27%" data-page="visa" aria-label="Visa purpose"></button>
      <button class="hotspot" style="left:24%;top:79%;width:53%;height:12%" data-page="travel" aria-label="Request now"></button>
    </div>
  </section>

  <section class="page" id="travel">
    <div class="stage form-stage" data-ratio="0.9140625">
      <img src="travel.png" alt="Travel request form">
      <button class="back-hotspot" style="left:2%;top:3%;width:8%;height:6%" data-page="purpose" aria-label="Back"></button>
      <form id="travel-form" class="overlay-form">
        <input aria-label="Departure sector" name="departure" placeholder="Enter Departure Sector (e.g. BOM)" required style="left:6.5%;top:43.6%;width:43%;height:5.2%">
        <input aria-label="Arrival sector" name="arrival" placeholder="Enter Arrival Sector (e.g. DXB)" required style="left:53.5%;top:43.6%;width:41%;height:5.2%">
        <select aria-label="Number of passengers" name="pax" required style="left:6.5%;top:52.1%;width:43%;height:5.2%"></select>
        <input aria-label="WhatsApp number" name="customerWhatsApp" type="tel" placeholder="Enter WhatsApp Number" required style="left:53.5%;top:52.1%;width:41%;height:5.2%">
        <textarea aria-label="Additional details" name="details" placeholder="Fill here..." style="left:6.5%;top:60.5%;width:88%;height:9.5%"></textarea>
        <button class="submit-hotspot" type="submit" aria-label="Submit request" style="left:26%;top:73%;width:48%;height:7.5%"></button>
      </form>
    </div>
  </section>

  <section class="page" id="visa">
    <div class="stage form-stage" data-ratio="0.9140625">
      <img src="visa.png" alt="Visa purpose request form">
      <button class="back-hotspot" style="left:2%;top:3%;width:8%;height:6%" data-page="purpose" aria-label="Back"></button>
      <form id="visa-form" class="overlay-form">
        <input aria-label="Departure sector" name="departure" placeholder="Select Departure Sector" required style="left:6%;top:39.5%;width:43%;height:5.5%">
        <input aria-label="Arrival sector" name="arrival" placeholder="Select Arrival Sector" required style="left:53%;top:39.5%;width:41%;height:5.5%">
        <select aria-label="Number of passengers" name="pax" required style="left:6%;top:48.5%;width:43%;height:5.5%"></select>
        <input aria-label="Date of travel" name="travelDate" type="date" required style="left:53%;top:48.5%;width:41%;height:5.5%">
        <textarea aria-label="Additional details" name="details" placeholder="Fill here..." style="left:6%;top:57.5%;width:88%;height:10%"></textarea>
        <button class="submit-hotspot" type="submit" aria-label="Submit request" style="left:26%;top:72%;width:48%;height:7.5%"></button>
      </form>
    </div>
  </section>

  <section class="page" id="hotel">
    <div class="stage form-stage" data-ratio="0.9140625">
      <img src="hotel.png" alt="Hotel booking request form">
      <button class="back-hotspot" style="left:2%;top:3%;width:8%;height:6%" data-page="home" aria-label="Back"></button>
      <form id="hotel-form" class="overlay-form">
        <input aria-label="Country name" name="country" placeholder="Select Country" required style="left:6%;top:38.8%;width:43%;height:4.8%">
        <input aria-label="City" name="city" placeholder="Select City" required style="left:53%;top:38.8%;width:41%;height:4.8%">
        <input aria-label="Check-in date" name="checkin" type="date" required style="left:6%;top:48%;width:43%;height:4.8%">
        <input aria-label="Check-out date" name="checkout" type="date" required style="left:53%;top:48%;width:41%;height:4.8%">
        <select aria-label="Number of passengers" name="pax" id="hotel-pax" required style="left:6%;top:57.3%;width:43%;height:4.8%"></select>
        <div id="passenger-overlay" class="passenger-overlay"></div>
        <textarea aria-label="Additional details" name="details" placeholder="Fill here..." style="left:6%;top:77%;width:88%;height:8%"></textarea>
        <button class="submit-hotspot" type="submit" aria-label="Send request" style="left:26%;top:89%;width:48%;height:7%"></button>
      </form>
    </div>
  </section>
</main>
<footer>RTS TOURS &amp; TRAVELS · WhatsApp +91 93266 85517</footer>
<script src="script.js"></script>
</body>
</html>
